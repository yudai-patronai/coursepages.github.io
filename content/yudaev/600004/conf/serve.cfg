# -*- coding: utf-8 -*-
# $Id$

contest_time = 180
score_system = kirov
board_fog_time = 0
board_unfog_time = 0
standings_locale = "Russian"

compile_dir = "../../compile/var/compile"

team_enable_src_view
team_enable_rep_view
team_enable_ce_view
report_error_code
ignore_compile_errors
problem_navigation
vertical_navigation


max_run_size = 32K
max_run_num = 512


stand_fancy_style
stand_extra_format = "%UMp1s %UMp1f %U0 %U1"

rounding_mode = floor
cr_serialization_key = 22723
show_astr_time
enable_runlog_merge
secure_run
detect_violations
enable_memory_limit_error
uuid_run_store
enable_max_stack_size
enable_l10n
team_download_time = 0
cpu_bogomips = 4800

[language]
id = 28
short_name = "gcc-vg"
long_name = "GNU C (valgrind) 4.8.3"
arch = "valgrind"
src_sfx = ".c"

[problem]
abstract
short_name = "Generic"
use_stdin
use_stdout
xml_file = "%Ps.xml"
test_dir = "%Ps"
test_sfx = ".dat"
use_corr
corr_dir = "%Ps"
corr_sfx = ".ans"
info_dir = "%Ps"
tgz_dir = "%Ps"
time_limit = 1
real_time_limit = 10
max_vm_size = 20480G
max_stack_size = 64M
max_file_size = 128M
max_open_file_count = 32
max_process_count = 32
test_score = 2
check_cmd = "check_%Ps"
lang_compiler_env = "gcc=EJUDGE_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror=maybe-uninitialized -Werror-implicit-function-declaration  -O3"
lang_compiler_env = "g++=EJUDGE_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror=maybe-uninitialized -O2"
lang_compiler_env = "gcc-vg=EJUDGE_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror=maybe-uninitialized -Werror-implicit-function-declaration -g -O1 -D ONLINE_JUDGE -lm"
lang_compiler_env = "g++-vg=EJUDGE_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror=maybe-uninitialized -g -O1"
lang_compiler_env = "clang=EJUDGE_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror-implicit-function-declaration -fsanitize=address -fno-omit-frame-pointer -g -O2"
lang_compiler_env = "clang++=EJUDGE_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -fsanitize=address -fno-omit-frame-pointer -g -O2"
lang_compiler_env = "gcc-vg=EJUDGE_ASAN_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror=maybe-uninitialized -Werror-implicit-function-declaration -fsanitize=address -fno-omit-frame-pointer -g -O3"
lang_compiler_env = "g++-vg=EJUDGE_ASAN_FLAGS=-Wall -Werror=format -Werror=return-type -Werror=vla -Werror=uninitialized -Werror=maybe-uninitialized -fsanitize=address -fno-omit-frame-pointer -g -O2"
start_env = "EJUDGE_VG_FLAGS=-q --track-origins=yes --malloc-fill=66 --free-fill=66 --error-exitcode=1 --leak-check=full"
enable_text_form

